[project]
name = "harmonic-praxis"
version = "0.9.0"
description = "Cybernetic Jacobian equilibrium solver, metamaterial tensor engine, and 4-layer GDSII foundry compiler."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "alaskadotedu", email = "alaskadotedu@://github.com" }
]
dependencies = []

[project.scripts]
harmonic-praxis = "harmonic_praxis.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmonic_praxis"]

[tool.ruff]
line-length = 100
target-version = "py310"